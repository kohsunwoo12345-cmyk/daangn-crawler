services:
  - type: web
    name: daangn-crawler
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
