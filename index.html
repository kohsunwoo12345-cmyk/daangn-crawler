<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🥕 Daangn Signage — 웹 사이니지</title>
<style>
:root{
  --or:#ff6f0f;--or2:#e55c00;--or-bg:#3a2414;
  --bg:#161618;--panel:#202024;--card:#26262b;--border:#34343a;
  --text:#f2f2f4;--sub:#9a9aa2;--green:#27ae60;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* ───── 공통 ───── */
.hide{display:none !important}

/* ───── 제어판 ───── */
.hdr{background:linear-gradient(90deg,var(--or),var(--or2));height:56px;display:flex;align-items:center;padding:0 22px;gap:10px}
.hdr .logo{font-size:24px}
.hdr h1{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr .tag{background:rgba(255,255,255,.2);font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.hdr .spacer{flex:1}
.hdr .hint{font-size:12px;color:rgba(255,255,255,.9)}

.wrap{max-width:1100px;margin:0 auto;padding:22px;display:grid;grid-template-columns:300px 1fr;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}

.sec{margin-bottom:22px}
.sec-t{font-size:12px;font-weight:800;color:var(--or);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}

.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s;background:var(--card)}
.mode:hover{border-color:#4a4a52}
.mode.active{border-color:var(--or);background:var(--or-bg)}
.mode .ic{font-size:20px;line-height:1}
.mode .name{font-size:13px;font-weight:700}
.mode .desc{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}

.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{font-size:12px;color:var(--sub);min-width:74px}
select,input[type=number]{flex:1;background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--or)}
input[type=number]{max-width:84px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);cursor:pointer;margin-bottom:8px}
.check input{width:16px;height:16px;accent-color:var(--or)}

.btn{width:100%;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;transition:.15s;margin-bottom:8px}
.btn-play{background:var(--or);color:#fff}
.btn-play:hover{background:var(--or2)}
.btn-sec{background:#34343a;color:#fff}
.btn-sec:hover{background:#43434b}
.playctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.minibtn{background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer}
.minibtn:hover{border-color:var(--or)}

/* 드롭존 / 목록 */
.main-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.main-top h2{font-size:15px;font-weight:800}
.main-top .spacer{flex:1}
.addbtn{background:var(--or);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
.addbtn:hover{background:var(--or2)}

.drop{border:2px dashed var(--border);border-radius:var(--r);padding:14px;transition:.15s}
.drop.over{border-color:var(--or);background:var(--or-bg)}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub);background:var(--card)}
.tab.active{border-color:var(--or);color:var(--text);background:var(--or-bg)}

.items{display:flex;flex-direction:column;gap:8px;min-height:80px}
.empty{color:var(--sub);font-size:12px;text-align:center;padding:30px 8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.item .thumb{width:46px;height:46px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.item .thumb img,.item .thumb video{width:100%;height:100%;object-fit:cover}
.item .meta{flex:1;min-width:0}
.item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:11px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:6px}
.item .sub input{width:50px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:2px 5px;font-size:11px}
.item .ops{display:flex;gap:4px}
.item .ops button{background:#34343a;border:none;color:#cfcfd4;width:26px;height:26px;border-radius:6px;cursor:pointer}
.item .ops button:hover{background:var(--or);color:#fff}

.note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.note b{color:var(--text)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--or);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}

/* ───── 플레이어(전체화면 재생) ───── */
#player{position:fixed;inset:0;background:#000;cursor:none}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s ease}
.layer.show{opacity:1}
.layer img,.layer video{width:100%;height:100%}
.fit-contain img,.fit-contain video{object-fit:contain}
.fit-cover img,.fit-cover video{object-fit:cover}
.fit-fill img,.fit-fill video{object-fit:fill}
#player-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5a5a5e;font-size:18px}
#player-idle .big{font-size:64px}
#player-hint{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#ddd;font-size:13px;cursor:pointer}
#player-hint.gone{display:none}
</style>
</head>
<body>

<!-- ════════ 제어판 ════════ -->
<div id="control">
  <div class="hdr">
    <span class="logo">🥕</span><h1>Daangn Signage</h1>
    <span class="tag">웹 사이니지</span>
    <span class="spacer"></span>
    <span class="hint">브라우저에서 사진·영상 무한 재생</span>
  </div>

  <div class="wrap">
    <aside>
      <div class="sec">
        <div class="sec-t">표시 방식</div>
        <div class="modes" id="modes">
          <label class="mode active" data-mode="mirror"><span class="ic">🔁</span>
            <span><span class="name">미러링</span><div class="desc">같은 사진/영상을 여러 화면에 동시에 똑같이</div></span></label>
          <label class="mode" data-mode="wall"><span class="ic">🖼️</span>
            <span><span class="name">비디오월</span><div class="desc">하나의 큰 영상/사진을 여러 화면에 걸쳐 이어서</div></span></label>
          <label class="mode" data-mode="separate"><span class="ic">🔢</span>
            <span><span class="name">각각 (독립)</span><div class="desc">화면마다 다른 재생목록을 따로</div></span></label>
        </div>
      </div>

      <div class="sec">
        <div class="sec-t">화면 수 / 재생 옵션</div>
        <div class="row"><label>화면 수</label>
          <select id="screenCount"><option value="1">1개</option><option value="2">2개</option><option value="3" selected>3개</option></select></div>
        <div class="row"><label>사진 표시</label><input type="number" id="imgDur" min="1" max="600" value="8"/><span style="font-size:12px;color:var(--sub)">초</span></div>
        <div class="row"><label>화면 맞춤</label>
          <select id="fit"><option value="contain">여백포함</option><option value="cover" selected>꽉채움</option><option value="fill">늘려채움</option></select></div>
        <label class="check"><input type="checkbox" id="muted" checked/> 영상 음소거(자동재생 보장)</label>
      </div>

      <div class="sec">
        <div class="sec-t">재생</div>
        <button class="btn btn-play" id="playHere">▶ 이 창에서 전체화면 재생</button>
        <button class="btn btn-sec" id="open3">🖥️ 화면 창 열기 (멀티 모니터)</button>
        <div class="playctl">
          <button class="minibtn" data-act="prev">⏮ 이전</button>
          <button class="minibtn" data-act="next">⏭ 다음</button>
          <button class="minibtn" data-act="pause">⏸</button>
          <button class="minibtn" data-act="resume">▶</button>
          <button class="minibtn" data-act="unmute">🔊</button>
          <button class="minibtn" data-act="mute">🔇</button>
        </div>
      </div>
    </aside>

    <main>
      <div class="main-top">
        <h2 id="listTitle">재생목록</h2><span class="spacer"></span>
        <button class="addbtn" id="addBtn">＋ 사진 / 영상 추가</button>
      </div>
      <div class="tabs hide" id="tabs"></div>
      <div class="drop" id="drop">
        <div class="items" id="items"></div>
      </div>
      <div class="note">
        💡 <b>멀티 모니터 사용법</b><br/>
        ① 재생목록을 채우고 → ② <b>🖥️ 화면 창 열기</b> 클릭 → ③ 열린 창들을 각 모니터로 드래그 → ④ 각 창을 클릭하면 <b>전체화면(소리 켜짐)</b>으로 전환됩니다.<br/>
        같은 PC·같은 브라우저의 창끼리 재생목록이 자동 동기화됩니다. 전체화면 해제는 <b>Esc</b>.
      </div>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple class="hide"/>
    </main>
  </div>
</div>

<!-- ════════ 플레이어 ════════ -->
<div id="player" class="hide">
  <div id="player-idle"><div class="big">🥕</div><div>재생 대기 중… 제어 창에서 ▶ 재생을 누르세요</div></div>
  <div id="player-hint">🖱️ 클릭하면 전체화면 + 소리 켜짐 · Esc 로 해제</div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const CHANNEL = 'daangn-signage';
const params = new URLSearchParams(location.search);
const ROLE = params.get('role') || 'control';

const IMAGE_EXT = ['jpg','jpeg','png','gif','webp','bmp','svg','avif'];
const VIDEO_EXT = ['mp4','webm','ogv','ogg','mov','m4v','mkv'];
function typeOf(file){
  if(file.type) return file.type.startsWith('video') ? 'video' : 'image';
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(VIDEO_EXT.includes(ext)) return 'video';
  return 'image';
}

/* ═══════════════ 재생 엔진 (제어창 오버레이 & 플레이어창 공용) ═══════════════ */
function createEngine(rootEl){
  let layers=[],active=0,idx=0,timer=null,paused=false;
  let items=[],mode='mirror',defaults={imageDuration:8,fit:'cover',muted:true};
  let wall=null; // {index,total}

  function mkLayers(){
    rootEl.querySelectorAll('.layer').forEach(e=>e.remove());
    layers=[];
    for(let i=0;i<2;i++){const d=document.createElement('div');d.className='layer';rootEl.appendChild(d);layers.push(d);}
    active=0;
  }
  function fitClass(){ return wall ? 'fit-cover' : 'fit-'+(defaults.fit||'cover'); }
  function clearTimer(){ if(timer){clearTimeout(timer);timer=null;} }

  function applyWall(el){
    if(!wall) return;
    el.style.width=(wall.total*100)+'vw';
    el.style.height='100vh';
    el.style.objectFit='cover';
    el.style.flex='0 0 auto';
    el.style.transform='translateX('+(-wall.index*100)+'vw)';
    el.parentElement.style.justifyContent='flex-start';
  }

  function build(item){
    let el;
    if(item.type==='video'){
      el=document.createElement('video');
      el.src=item.url; el.muted=!!defaults.muted; el.autoplay=true; el.loop=false; el.playsInline=true;
    }else{
      el=document.createElement('img'); el.src=item.url;
    }
    return el;
  }

  function play(i){
    if(!items.length){ idle(true); return; }
    idle(false); clearTimer();
    idx=((i%items.length)+items.length)%items.length;
    const item=items[idx];
    const incoming=layers[1-active], outgoing=layers[active];
    incoming.className='layer '+fitClass(); incoming.innerHTML='';
    const el=build(item); incoming.appendChild(el); applyWall(el);
    const advance=()=>{ if(!paused) play(idx+1); };
    if(item.type==='video'){
      el.addEventListener('ended',advance,{once:true});
      el.addEventListener('error',()=>{timer=setTimeout(advance,1500);},{once:true});
      el.play().catch(()=>{});
    }else{
      el.addEventListener('error',()=>{timer=setTimeout(advance,1500);},{once:true});
      timer=setTimeout(advance,(item.duration||defaults.imageDuration||8)*1000);
    }
    requestAnimationFrame(()=>{incoming.classList.add('show');outgoing.classList.remove('show');});
    active=1-active;
  }
  function idle(on){ const e=document.getElementById('player-idle'); if(e) e.classList.toggle('hide',!on); }

  return {
    load(cfg){
      items=cfg.items||[]; mode=cfg.mode||'mirror'; defaults=cfg.defaults||defaults; wall=cfg.wall||null;
      paused=false; idx=0; mkLayers();
      if(items.length) play(0); else idle(true);
    },
    cmd(action){
      const v=rootEl.querySelector('video');
      if(action==='pause'){paused=true;clearTimer();if(v)v.pause();}
      else if(action==='resume'){paused=false;if(v)v.play().catch(()=>{});else play(idx);}
      else if(action==='next'){play(idx+1);}
      else if(action==='prev'){play(idx-1);}
      else if(action==='mute'){defaults.muted=true;if(v)v.muted=true;}
      else if(action==='unmute'){defaults.muted=false;if(v)v.muted=false;}
    },
    setMuted(m){ defaults.muted=m; const v=rootEl.querySelector('video'); if(v)v.muted=m; }
  };
}

/* ═══════════════ 플레이어 창 ═══════════════ */
function initPlayer(){
  document.getElementById('control').classList.add('hide');
  document.getElementById('player').classList.remove('hide');
  document.title='🥕 화면 '+(params.get('screen')||'1');
  const root=document.getElementById('player');
  const engine=createEngine(root);
  const myScreen=parseInt(params.get('screen')||'1',10)-1;
  const bc=new BroadcastChannel(CHANNEL);

  function objURLs(list){ return list.map(it=>({type:it.type,duration:it.duration,url:URL.createObjectURL(it.file)})); }

  bc.onmessage=(e)=>{
    const m=e.data;
    if(m.t==='state'){
      let listItems;
      if(m.mode==='separate'){ listItems=objURLs((m.playlists&&m.playlists[myScreen])||[]); }
      else { listItems=objURLs(m.playlist||[]); }
      const cfg={ items:listItems, mode:m.mode, defaults:m.defaults,
        wall: m.mode==='wall' ? {index:myScreen,total:m.screenCount||1} : null };
      engine.load(cfg);
    } else if(m.t==='cmd'){ engine.cmd(m.action); }
  };
  // 제어창에 현재 상태 요청
  bc.postMessage({t:'hello',screen:myScreen});

  // 클릭 → 전체화면 + 소리
  const hint=document.getElementById('player-hint');
  root.addEventListener('click',()=>{
    if(!document.fullscreenElement) root.requestFullscreen().catch(()=>{});
    engine.setMuted(false);
    hint.classList.add('gone');
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&document.fullscreenElement) document.exitFullscreen(); });
}

/* ═══════════════ 제어판 ═══════════════ */
function initControl(){
  const bc=new BroadcastChannel(CHANNEL);
  let toastT=null;
  const $=s=>document.querySelector(s);
  const $$=s=>document.querySelectorAll(s);
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

  const state={ mode:'mirror', screenCount:3, lists:[[],[],[]], activeTab:0 };
  let overlayEngine=null;
  let playerWins=[];

  function buildState(){
    const defaults={ imageDuration:parseInt($('#imgDur').value,10)||8, fit:$('#fit').value, muted:$('#muted').checked };
    const base={ t:'state', mode:state.mode, screenCount:state.screenCount, defaults };
    if(state.mode==='separate') base.playlists=state.lists.slice(0,state.screenCount);
    else base.playlist=state.lists[0];
    return base;
  }
  function broadcast(){ window._lastState=buildState(); bc.postMessage(window._lastState); }

  // 파일 추가
  function addFiles(fileList,listIdx){
    const arr=[...fileList];
    if(!arr.length) return;
    arr.forEach(f=>state.lists[listIdx].push({file:f,type:typeOf(f),name:f.name,duration:undefined}));
    render(); toast(arr.length+'개 추가됨');
  }

  function setMode(mode){
    state.mode=mode;
    $$('#modes .mode').forEach(m=>m.classList.toggle('active',m.dataset.mode===mode));
    render();
  }

  function currentTabList(){ return state.mode==='separate' ? state.activeTab : 0; }

  function render(){
    // 탭 (각각 모드)
    const tabs=$('#tabs');
    if(state.mode==='separate'){
      tabs.classList.remove('hide'); tabs.innerHTML='';
      for(let i=0;i<state.screenCount;i++){
        const t=document.createElement('div');
        t.className='tab'+(state.activeTab===i?' active':'');
        t.textContent='화면 '+(i+1)+' ('+state.lists[i].length+')';
        t.onclick=()=>{state.activeTab=i;render();};
        tabs.appendChild(t);
      }
      $('#listTitle').textContent='화면별 재생목록 (각각)';
    }else{
      tabs.classList.add('hide');
      $('#listTitle').textContent= state.mode==='wall' ? '재생목록 (여러 화면에 걸쳐 표시)' : '재생목록 (여러 화면 동시)';
    }
    // 목록
    const li=currentTabList();
    const box=$('#items'); box.innerHTML='';
    const arr=state.lists[li];
    if(!arr.length){ box.innerHTML='<div class="empty">파일을 끌어다 놓거나 ＋ 버튼으로 추가하세요</div>'; return; }
    arr.forEach((it,i)=>box.appendChild(renderItem(it,li,i)));
    broadcast(); // 변경 시 자동 동기화
  }

  function renderItem(it,li,i){
    const el=document.createElement('div'); el.className='item';
    const url=URL.createObjectURL(it.file);
    const thumb = it.type==='video' ? `<video src="${url}#t=0.1" muted></video>` : `<img src="${url}"/>`;
    const dur = it.type==='image'
      ? `⏱ <input type="number" min="1" max="600" placeholder="기본" value="${it.duration||''}"/>초`
      : `🎬 영상 전체 재생`;
    el.innerHTML=`<div class="thumb">${thumb}</div>
      <div class="meta"><div class="nm" title="${it.name}">${it.name}</div>
      <div class="sub">${it.type==='video'?'🎬 영상':'🖼️ 사진'} · <span class="d">${dur}</span></div></div>
      <div class="ops"><button data-o="up">▲</button><button data-o="down">▼</button><button data-o="del">✕</button></div>`;
    el.querySelector('[data-o=up]').onclick=()=>move(li,i,-1);
    el.querySelector('[data-o=down]').onclick=()=>move(li,i,1);
    el.querySelector('[data-o=del]').onclick=()=>{state.lists[li].splice(i,1);render();};
    const di=el.querySelector('.sub input');
    if(di) di.onchange=e=>{const v=parseInt(e.target.value,10);state.lists[li][i].duration=v>0?v:undefined;};
    return el;
  }
  function move(li,i,d){const a=state.lists[li];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();}

  // 이벤트
  $$('#modes .mode').forEach(m=>m.onclick=()=>setMode(m.dataset.mode));
  $('#screenCount').onchange=e=>{state.screenCount=parseInt(e.target.value,10);if(state.activeTab>=state.screenCount)state.activeTab=0;render();};
  $('#addBtn').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{addFiles(e.target.files,currentTabList());e.target.value='';};
  ['imgDur','fit','muted'].forEach(id=>$('#'+id).onchange=broadcast);
  $$('.playctl .minibtn').forEach(b=>b.onclick=()=>{ const a={t:'cmd',action:b.dataset.act}; bc.postMessage(a); if(overlayEngine) overlayEngine.cmd(b.dataset.act); });

  // 드래그&드롭
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files,currentTabList()); });

  // 이 창에서 전체화면 재생 (오버레이)
  $('#playHere').onclick=()=>{
    const st=buildState();
    const hasMedia = state.mode==='separate' ? st.playlists.some(l=>l.length) : st.playlist.length;
    if(!hasMedia){toast('사진·영상을 먼저 추가하세요');return;}
    document.getElementById('control').classList.add('hide');
    const p=document.getElementById('player'); p.classList.remove('hide');
    overlayEngine=createEngine(p);
    const list = state.mode==='separate' ? (st.playlists[0]||[]) : st.playlist;
    overlayEngine.load({ items:list.map(it=>({type:it.type,duration:it.duration,url:URL.createObjectURL(it.file)})),
      mode:state.mode, defaults:st.defaults, wall: state.mode==='wall'?{index:0,total:1}:null });
    p.requestFullscreen&&p.requestFullscreen().catch(()=>{});
    const hint=document.getElementById('player-hint');
    p.addEventListener('click',()=>{overlayEngine.setMuted(false);hint.classList.add('gone');},{once:false});
    document.addEventListener('keydown',escClose);
  };
  function escClose(e){ if(e.key==='Escape'){ if(document.fullscreenElement)document.exitFullscreen();
    document.getElementById('player').classList.add('hide'); document.getElementById('control').classList.remove('hide'); overlayEngine=null; } }

  // 멀티 모니터 창 열기
  $('#open3').onclick=()=>{
    const st=buildState();
    const hasMedia = state.mode==='separate' ? st.playlists.some(l=>l.length) : st.playlist.length;
    if(!hasMedia){toast('사진·영상을 먼저 추가하세요');return;}
    for(let i=1;i<=state.screenCount;i++){
      const w=window.open(location.pathname+'?role=player&screen='+i,'signage_screen_'+i,'width=960,height=540');
      if(w) playerWins.push(w);
    }
    setTimeout(broadcast,600); // 창 로드 후 상태 전송
    toast(state.screenCount+'개 화면 창을 열었습니다. 각 모니터로 옮긴 뒤 클릭하세요');
  };

  // 플레이어 창이 hello 보내면 현재 상태 응답
  bc.onmessage=(e)=>{ if(e.data && e.data.t==='hello'){ bc.postMessage(window._lastState||buildState()); } };

  render();
}

/* ═══════════════ 진입 ═══════════════ */
if(ROLE==='player') initPlayer(); else initControl();
</script>
</body>
</html>
